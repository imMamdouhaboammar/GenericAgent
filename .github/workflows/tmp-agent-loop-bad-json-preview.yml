name: Temporary agent-loop bad-json preview regression

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded malformed-argument preview after RED
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('agent_loop.py')
          text = path.read_text(encoding='utf-8')
          old = '''                except (json.JSONDecodeError, TypeError):\n                    tool_calls.append({'tool_name': 'bad_json', 'args': {'msg': f"Tool {tc.function.name} arguments are invalid JSON or are not a JSON object: {raw!r}. Retry with a valid JSON object."}, 'id': tc.id})\n                    continue\n'''
          new = '''                except (json.JSONDecodeError, TypeError):\n                    raw_text = raw if isinstance(raw, str) else str(raw)\n                    raw_len = len(raw_text)\n                    raw_preview = raw_text[:800]\n                    if raw_len > len(raw_preview): raw_preview += f"... [truncated, total={raw_len} chars]"\n                    tool_calls.append({'tool_name': 'bad_json', 'args': {'msg': f"Tool {tc.function.name} arguments are invalid JSON or are not a JSON object: {raw_preview!r}. Retry with a valid JSON object."}, 'id': tc.id})\n                    continue\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('bad-json recovery block not found')
          path.write_text(text, encoding='utf-8')
          PY
      - run: python -m pip install -e .
      - run: python -m py_compile agent_loop.py tests/test_agent_loop_bad_json.py
      - run: python -m unittest tests.test_agent_loop_bad_json -v
      - run: git diff --check
      - name: Persist production fix when needed
        run: |
          if ! git diff --quiet -- agent_loop.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add agent_loop.py
            git commit -m "fix(agent-loop): bound malformed argument retry preview"
            git push origin HEAD:${{ github.head_ref }}
          fi

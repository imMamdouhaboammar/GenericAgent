name: Temporary agent-loop bad-json preview regression

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m py_compile agent_loop.py tests/test_agent_loop_bad_json.py
      - run: python -m unittest tests.test_agent_loop_bad_json -v
      - run: git diff --check

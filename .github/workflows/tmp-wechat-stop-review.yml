name: Temporary WeChat review regression

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply idle stop guard after RED was confirmed
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontends/wechatapp.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if text in ('/stop', '/abort'):\n        agent.abort()\n        _task_aborted[uid] = True\n        print(f'[WX] /stop set _task_aborted[{uid}]', file=sys.__stdout__)\n        return\n'''
          new = '''    if text in ('/stop', '/abort'):\n        if agent.is_running:\n            _task_aborted[uid] = True\n            agent.abort()\n            print(f'[WX] /stop set _task_aborted[{uid}]', file=sys.__stdout__)\n        else:\n            _task_aborted.pop(uid, None)\n        return\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('stop command block not found')
          path.write_text(text, encoding='utf-8')
          PY
      - run: python -m pip install -e .
      - run: python -m py_compile frontends/wechatapp.py tests/test_wechat_stop.py
      - run: python -m unittest tests.test_wechat_stop -v
      - run: git diff --check
      - name: Persist production fix when needed
        run: |
          if ! git diff --quiet -- frontends/wechatapp.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontends/wechatapp.py
            git commit -m "fix(wechat): ignore idle stop commands"
            git push origin HEAD:${{ github.head_ref }}
          fi

name: Temporary no-tool completion regression

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile agent_loop.py tests/test_agent_loop_no_tool.py
      - run: python -m unittest tests.test_agent_loop_no_tool -v
      - run: git diff --check

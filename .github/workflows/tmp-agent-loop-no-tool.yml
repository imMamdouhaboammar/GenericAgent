name: Temporary no-tool completion regression

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply no-tool completion fix after RED was confirmed
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('agent_loop.py')
          text = path.read_text(encoding='utf-8')
          old = '''        elif tool_name == 'bad_json': return StepOutcome(None, next_prompt=args.get('msg', 'bad_json'), should_exit=False)\n        else:\n'''
          new = '''        elif tool_name == 'bad_json': return StepOutcome(None, next_prompt=args.get('msg', 'bad_json'), should_exit=False)\n        elif tool_name == 'no_tool': return StepOutcome(response.content, next_prompt=None, should_exit=False)\n        else:\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('dispatch recovery block not found')
          path.write_text(text, encoding='utf-8')
          PY
      - run: python -m py_compile agent_loop.py tests/test_agent_loop_no_tool.py
      - run: python -m unittest tests.test_agent_loop_no_tool -v
      - run: git diff --check
      - name: Persist production fix when needed
        run: |
          if ! git diff --quiet -- agent_loop.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add agent_loop.py
            git commit -m "fix(agent-loop): complete direct answers"
            git push origin HEAD:${{ github.head_ref }}
          fi

name: Temporary desktop bridge origin regression

on:
  push:
    branches:
      - fix/desktop-bridge-origin-guard
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "aiohttp>=3.9"
      - name: Run origin regression tests
        run: python -m unittest tests.test_desktop_bridge_origin -v

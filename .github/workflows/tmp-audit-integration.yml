name: Temporary audited fixes integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Combine clean contribution branches
        run: |
          set -euxo pipefail
          if git log -1 --pretty=%s | grep -q '^integration:'; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE=d946498bcf873c3f38e32807c924a58c0d48f962
          branches=(
            fix/desktop-bridge-origin-guard-upstream
            fix/conductor-browser-origin-guard-upstream
            fix/agentmain-reject-unknown-cli-upstream
            fix/desktop-session-id-path-traversal-upstream
            fix/memory-import-symlink-boundary-upstream
            fix/desktop-session-persistence-race-upstream
            fix/agent-loop-invalid-tool-json-upstream
            fix/agent-loop-no-tool-completion-upstream
            fix/wechat-stop-suppresses-output-upstream
            fix/ga-cli-current-python-upstream
          )
          for branch in "${branches[@]}"; do
            git fetch origin "$branch:refs/remotes/origin/$branch"
            commits=$(git rev-list --reverse "$BASE..origin/$branch")
            for commit in $commits; do
              if git cherry-pick "$commit"; then
                continue
              fi
              if [ "$branch" != "fix/desktop-session-persistence-race-upstream" ]; then
                exit 1
              fi
              git checkout --ours frontends/desktop_bridge.py
              git checkout "$commit" -- tests/test_desktop_session_persistence.py
              python - <<'PY'
          from pathlib import Path
          path = Path('frontends/desktop_bridge.py')
          text = path.read_text(encoding='utf-8')
          old = '''    def _persist_session(self, s: "Session"):\n        """Write a single session file. Cost is O(one session), independent of how many\n        sessions exist — this is the fix for the monolithic-file scaling problem."""\n        try:\n            self._sessions_dir.mkdir(parents=True, exist_ok=True)\n            with self.lock:\n                data = self._session_dict(s)\n            target = self._session_file(s.id)\n            tmp = target.with_suffix(target.suffix + ".tmp")\n            tmp.write_text(json.dumps(data, ensure_ascii=False, default=str), encoding="utf-8")\n            os.replace(tmp, target)  # atomic swap\n        except Exception as e:\n            print(f"[bridge] persist session {s.id} failed: {e}", file=sys.stderr)\n\n    def _delete_session_file(self, sid: str):\n        try:\n            f = self._session_file(sid)\n            if f.exists():\n                f.unlink()\n        except Exception as e:\n            print(f"[bridge] delete session file {sid} failed: {e}", file=sys.stderr)\n'''
          new = '''    def _persist_session(self, s: "Session"):\n        """Write a single session file. Cost is O(one session), independent of how many\n        sessions exist — this is the fix for the monolithic-file scaling problem."""\n        try:\n            self._sessions_dir.mkdir(parents=True, exist_ok=True)\n            with self.lock:\n                if self.sessions.get(s.id) is not s:\n                    return\n                data = self._session_dict(s)\n                target = self._session_file(s.id)\n                tmp = target.with_suffix(target.suffix + ".tmp")\n                tmp.write_text(json.dumps(data, ensure_ascii=False, default=str), encoding="utf-8")\n                os.replace(tmp, target)  # atomic swap\n        except Exception as e:\n            print(f"[bridge] persist session {s.id} failed: {e}", file=sys.stderr)\n\n    def _delete_session_file(self, sid: str):\n        try:\n            with self.lock:\n                f = self._session_file(sid)\n                if f.exists():\n                    f.unlink()\n        except Exception as e:\n            print(f"[bridge] delete session file {sid} failed: {e}", file=sys.stderr)\n'''
          if old not in text:
              raise SystemExit('combined desktop persistence block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
              git add frontends/desktop_bridge.py tests/test_desktop_session_persistence.py
              git cherry-pick --continue
            done
          done
      - run: python -m pip install -e .
      - run: python -m py_compile agent_loop.py agentmain.py ga_cli/cli.py frontends/desktop_bridge.py frontends/conductor.py frontends/wechatapp.py
      - run: python -m unittest discover -s tests -v
      - run: git diff --check ${{ github.event.pull_request.base.sha }} HEAD
      - name: Persist combined integration branch
        run: |
          if ! git log -1 --pretty=%s | grep -q '^integration:'; then
            git commit --allow-empty -m "integration: combine audited fixes"
            git push origin HEAD:${{ github.head_ref }}
          fi

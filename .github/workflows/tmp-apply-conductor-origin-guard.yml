name: Temporary apply conductor origin guard

on:
  push:
    branches:
      - fix/conductor-browser-origin-guard

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'enable one-shot conductor origin patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/conductor-browser-origin-guard
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply minimal browser origin guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontends/conductor.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from contextlib import asynccontextmanager, suppress\n', 'from contextlib import asynccontextmanager, suppress\nfrom urllib.parse import urlsplit\n')
          text = text.replace('from fastapi.middleware.cors import CORSMiddleware\n', '')
          marker = 'app = FastAPI(title="Conductor", lifespan=lifespan)\napp.add_middleware(CORSMiddleware, allow_origins=["*"], allow_methods=["*"], allow_headers=["*"])\n\n'
          replacement = '''def _origin_matches_host(origin: str, host: str) -> bool:
              try:
                  parsed_origin = urlsplit(origin)
                  parsed_host = urlsplit("//" + host)
              except ValueError:
                  return False
              if parsed_origin.scheme not in ("http", "https"):
                  return False
              return bool(parsed_origin.hostname and parsed_host.hostname and
                          parsed_origin.hostname.lower() == parsed_host.hostname.lower())


          def _cors_headers(origin: str) -> dict:
              return {
                  "Access-Control-Allow-Origin": origin,
                  "Access-Control-Allow-Methods": "GET,POST,PUT,PATCH,DELETE,OPTIONS",
                  "Access-Control-Allow-Headers": "Content-Type,Authorization",
                  "Vary": "Origin",
              }


          class BrowserOriginGuard:
              def __init__(self, app): self.app = app
              async def __call__(self, scope, receive, send):
                  if scope.get("type") not in ("http", "websocket"):
                      return await self.app(scope, receive, send)
                  headers = {k.decode("latin-1").lower(): v.decode("latin-1") for k, v in scope.get("headers", [])}
                  origin, host = headers.get("origin", ""), headers.get("host", "")
                  if origin and not _origin_matches_host(origin, host):
                      if scope["type"] == "websocket":
                          return await send({"type": "websocket.close", "code": 1008})
                      return await PlainTextResponse("Forbidden", status_code=403)(scope, receive, send)
                  if scope["type"] == "websocket":
                      return await self.app(scope, receive, send)
                  cors = _cors_headers(origin) if origin else {}
                  if scope.get("method") == "OPTIONS" and origin:
                      return await PlainTextResponse("", status_code=204, headers=cors)(scope, receive, send)
                  async def send_with_cors(message):
                      if cors and message.get("type") == "http.response.start":
                          message = dict(message)
                          message["headers"] = list(message.get("headers", [])) + [
                              (k.encode("latin-1"), v.encode("latin-1")) for k, v in cors.items()
                          ]
                      await send(message)
                  await self.app(scope, receive, send_with_cors)


          app = FastAPI(title="Conductor", lifespan=lifespan)
          app.add_middleware(BrowserOriginGuard)

          '''
          if marker not in text:
              raise SystemExit('expected conductor middleware marker not found')
          path.write_text(text.replace(marker, replacement), encoding='utf-8')
          PY
      - name: Syntax check
        run: python -m py_compile frontends/conductor.py tests/test_conductor_origin.py
      - name: Install test dependencies
        run: python -m pip install -e . fastapi httpx
      - name: Run origin regression tests
        run: python -m unittest tests.test_conductor_origin -v
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontends/conductor.py
          git commit -m "fix(security): restrict Conductor browser origins"
          git push origin HEAD:fix/conductor-browser-origin-guard

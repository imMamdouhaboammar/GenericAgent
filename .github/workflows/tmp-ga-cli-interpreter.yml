name: Temporary ga CLI interpreter regression

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile ga_cli/cli.py tests/test_ga_cli_interpreter.py
      - run: python -m unittest tests.test_ga_cli_interpreter -v
      - run: git diff --check

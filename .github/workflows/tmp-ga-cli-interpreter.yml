name: Temporary ga CLI interpreter regression

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply interpreter fix after RED was confirmed
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ga_cli/cli.py')
          text = path.read_text(encoding='utf-8')
          old = '''    # 插入额外参数\n    if args:\n        full_cmd.extend(args)\n\n    print(f"🚀 {' '.join(full_cmd)}")\n'''
          new = '''    # 插入额外参数\n    if args:\n        full_cmd.extend(args)\n    if full_cmd and full_cmd[0] == "python":\n        full_cmd[0] = sys.executable\n\n    print(f"🚀 {' '.join(full_cmd)}")\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('launch_frontend block not found')
          path.write_text(text, encoding='utf-8')
          PY
      - run: python -m py_compile ga_cli/cli.py tests/test_ga_cli_interpreter.py
      - run: python -m unittest tests.test_ga_cli_interpreter -v
      - run: git diff --check
      - name: Persist production fix when needed
        run: |
          if ! git diff --quiet -- ga_cli/cli.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ga_cli/cli.py
            git commit -m "fix(cli): launch with the active Python interpreter"
            git push origin HEAD:${{ github.head_ref }}
          fi

name: Temporary WeChat stop regression

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m py_compile frontends/wechatapp.py tests/test_wechat_stop.py
      - run: python -m unittest tests.test_wechat_stop -v
      - run: git diff --check

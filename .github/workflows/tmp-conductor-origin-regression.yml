name: Temporary conductor origin regression

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e . fastapi httpx
      - name: Run conductor origin regression tests
        run: python -m unittest tests.test_conductor_origin -v

  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/conductor-browser-origin-guard
      - id: need
        name: Check whether canonical origin parser is needed
        run: |
          if grep -q 'def _origin_hostname' frontends/conductor.py; then
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.need.outputs.apply == 'true'
        with:
          python-version: "3.12"
      - name: Validate serialized browser origins
        if: steps.need.outputs.apply == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontends/conductor.py')
          text = path.read_text(encoding='utf-8')
          old = '''_LOOPBACK_HOSTS = {"127.0.0.1", "localhost", "::1"}


          def _origin_matches_host(origin: str, host: str) -> bool:
              try:
                  parsed_origin = urlsplit(origin)
                  parsed_host = urlsplit("//" + host)
              except ValueError:
                  return False
              if parsed_origin.scheme not in ("http", "https"):
                  return False
              origin_host = (parsed_origin.hostname or "").lower()
              request_host = (parsed_host.hostname or "").lower()
              if args.host.lower() in _LOOPBACK_HOSTS:
                  return origin_host in _LOOPBACK_HOSTS and request_host in _LOOPBACK_HOSTS
              return bool(origin_host and request_host and origin_host == request_host)
          '''
          new = '''_LOOPBACK_HOSTS = {"127.0.0.1", "localhost", "::1"}


          def _origin_hostname(origin: str) -> str:
              if origin != origin.strip(): return ""
              try:
                  parsed = urlsplit(origin)
                  parsed.port
              except ValueError:
                  return ""
              if (parsed.scheme.lower() not in ("http", "https") or not parsed.hostname or
                      parsed.username is not None or parsed.password is not None or
                      parsed.path not in ("", "/") or parsed.query or parsed.fragment):
                  return ""
              return parsed.hostname.lower()


          def _request_hostname(host: str) -> str:
              try:
                  parsed = urlsplit("//" + host)
                  parsed.port
              except ValueError:
                  return ""
              if parsed.username is not None or parsed.password is not None:
                  return ""
              return (parsed.hostname or "").lower()


          def _origin_matches_host(origin: str, host: str) -> bool:
              origin_host = _origin_hostname(origin)
              request_host = _request_hostname(host)
              if not origin_host or not request_host:
                  return False
              if args.host.lower() in _LOOPBACK_HOSTS:
                  return origin_host in _LOOPBACK_HOSTS and request_host in _LOOPBACK_HOSTS
              return origin_host == request_host
          '''
          if old not in text:
              raise SystemExit('expected hardened origin matcher not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Verify patch
        if: steps.need.outputs.apply == 'true'
        run: |
          python -m py_compile frontends/conductor.py tests/test_conductor_origin.py
          python -m pip install -e . fastapi httpx
          python -m unittest tests.test_conductor_origin -v
          git diff --check
      - name: Commit patch
        if: steps.need.outputs.apply == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontends/conductor.py
          git commit -m "fix(security): validate serialized Conductor origins"
          git push origin HEAD:fix/conductor-browser-origin-guard

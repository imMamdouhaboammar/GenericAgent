name: Temporary conductor origin regression

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e . fastapi httpx
      - name: Run conductor origin regression tests
        run: python -m unittest tests.test_conductor_origin -v

  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/conductor-browser-origin-guard
      - id: need
        name: Check whether rebinding guard is needed
        run: |
          if grep -q '_LOOPBACK_HOSTS' frontends/conductor.py; then
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.need.outputs.apply == 'true'
        with:
          python-version: "3.12"
      - name: Harden loopback origin matching
        if: steps.need.outputs.apply == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontends/conductor.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _origin_matches_host(origin: str, host: str) -> bool:
              try:
                  parsed_origin = urlsplit(origin)
                  parsed_host = urlsplit("//" + host)
              except ValueError:
                  return False
              if parsed_origin.scheme not in ("http", "https"):
                  return False
              return bool(parsed_origin.hostname and parsed_host.hostname and
                          parsed_origin.hostname.lower() == parsed_host.hostname.lower())
          '''
          new = '''_LOOPBACK_HOSTS = {"127.0.0.1", "localhost", "::1"}


          def _origin_matches_host(origin: str, host: str) -> bool:
              try:
                  parsed_origin = urlsplit(origin)
                  parsed_host = urlsplit("//" + host)
              except ValueError:
                  return False
              if parsed_origin.scheme not in ("http", "https"):
                  return False
              origin_host = (parsed_origin.hostname or "").lower()
              request_host = (parsed_host.hostname or "").lower()
              if args.host.lower() in _LOOPBACK_HOSTS:
                  return origin_host in _LOOPBACK_HOSTS and request_host in _LOOPBACK_HOSTS
              return bool(origin_host and request_host and origin_host == request_host)
          '''
          if old not in text:
              raise SystemExit('expected origin matcher not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Verify patch
        if: steps.need.outputs.apply == 'true'
        run: |
          python -m py_compile frontends/conductor.py tests/test_conductor_origin.py
          python -m pip install -e . fastapi httpx
          python -m unittest tests.test_conductor_origin -v
          git diff --check
      - name: Commit patch
        if: steps.need.outputs.apply == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontends/conductor.py
          git commit -m "fix(security): reject rebinding origins on loopback Conductor"
          git push origin HEAD:fix/conductor-browser-origin-guard

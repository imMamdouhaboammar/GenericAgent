name: Temporary memory import symlink regression

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fix after RED was confirmed
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontends/desktop_bridge.py')
          text = path.read_text(encoding='utf-8')
          marker = '\n\ndef _import_memory_from(source_dir: str, ga_root: str) -> dict:\n'
          helper = '''\n\ndef _safe_import_items(root: Path):\n    resolved_root = root.resolve()\n    for item in root.rglob("*"):\n        try:\n            item.resolve().relative_to(resolved_root)\n        except (OSError, ValueError):\n            continue\n        if item.is_symlink():\n            continue\n        yield item\n'''
          if helper not in text:
              if marker not in text:
                  raise SystemExit('memory import marker not found')
              text = text.replace(marker, helper + marker, 1)
          text = text.replace('for item in src_mem.rglob("*"):', 'for item in _safe_import_items(src_mem):', 1)
          text = text.replace('for item in src_resp.rglob("*"):', 'for item in _safe_import_items(src_resp):', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - run: python -m pip install -e .
      - run: python -m py_compile frontends/desktop_bridge.py tests/test_desktop_memory_import.py
      - run: python -m unittest tests.test_desktop_memory_import -v
      - run: git diff --check
      - name: Persist production fix when needed
        run: |
          if ! git diff --quiet -- frontends/desktop_bridge.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontends/desktop_bridge.py
            git commit -m "fix(desktop): keep memory imports inside source root"
            git push origin HEAD:${{ github.head_ref }}
          fi

name: Temporary agentmain CLI regression

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core dependencies
        run: python -m pip install -e .
      - name: Run CLI argument regression tests
        run: python -m unittest tests.test_agentmain_cli_args -v

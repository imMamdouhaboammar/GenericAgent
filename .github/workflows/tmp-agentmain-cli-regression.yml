name: Temporary agentmain CLI regression

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core dependencies
        run: python -m pip install -e .
      - name: Run CLI argument regression tests
        run: python -m unittest tests.test_agentmain_cli_args -v

  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/agentmain-reject-unknown-cli
      - id: need
        name: Check whether option-shaped values are rejected
        run: |
          if grep -q "any(v.startswith('--') for v in _unknown\[1::2\])" agentmain.py; then
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.need.outputs.apply == 'true'
        with:
          python-version: "3.12"
      - name: Reject option-shaped reflect values
        if: steps.need.outputs.apply == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('agentmain.py')
          text = path.read_text(encoding='utf-8')
          old = "    if args.reflect and (len(_unknown) % 2 or any(not k.startswith('--') for k in _unknown[::2])):\n"
          new = "    if args.reflect and (len(_unknown) % 2 or any(not k.startswith('--') for k in _unknown[::2]) or any(v.startswith('--') for v in _unknown[1::2])):\n"
          if old not in text:
              raise SystemExit('expected reflect argument validation not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Verify patch
        if: steps.need.outputs.apply == 'true'
        run: |
          python -m py_compile agentmain.py tests/test_agentmain_cli_args.py
          python -m pip install -e .
          python -m unittest tests.test_agentmain_cli_args -v
          git diff --check
      - name: Commit patch
        if: steps.need.outputs.apply == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agentmain.py
          git commit -m "fix(cli): reject option-shaped reflect values"
          git push origin HEAD:fix/agentmain-reject-unknown-cli

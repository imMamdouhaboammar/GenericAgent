name: Temporary session persistence race regression

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply persistence fix after RED was confirmed
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontends/desktop_bridge.py')
          text = path.read_text(encoding='utf-8')
          old = '''    def _persist_session(self, s: "Session"):\n        """Write a single session file. Cost is O(one session), independent of how many\n        sessions exist — this is the fix for the monolithic-file scaling problem."""\n        try:\n            self._sessions_dir.mkdir(parents=True, exist_ok=True)\n            with self.lock:\n                data = self._session_dict(s)\n            tmp = self._sessions_dir / f"{s.id}.json.tmp"\n            tmp.write_text(json.dumps(data, ensure_ascii=False, default=str), encoding="utf-8")\n            os.replace(tmp, self._session_file(s.id))  # atomic swap\n        except Exception as e:\n            print(f"[bridge] persist session {s.id} failed: {e}", file=sys.stderr)\n\n    def _delete_session_file(self, sid: str):\n        try:\n            f = self._session_file(sid)\n            if f.exists():\n                f.unlink()\n        except Exception as e:\n            print(f"[bridge] delete session file {sid} failed: {e}", file=sys.stderr)\n'''
          new = '''    def _persist_session(self, s: "Session"):\n        """Write a single session file. Cost is O(one session), independent of how many\n        sessions exist — this is the fix for the monolithic-file scaling problem."""\n        try:\n            self._sessions_dir.mkdir(parents=True, exist_ok=True)\n            with self.lock:\n                if self.sessions.get(s.id) is not s:\n                    return\n                data = self._session_dict(s)\n                tmp = self._sessions_dir / f"{s.id}.json.tmp"\n                tmp.write_text(json.dumps(data, ensure_ascii=False, default=str), encoding="utf-8")\n                os.replace(tmp, self._session_file(s.id))  # atomic swap\n        except Exception as e:\n            print(f"[bridge] persist session {s.id} failed: {e}", file=sys.stderr)\n\n    def _delete_session_file(self, sid: str):\n        try:\n            with self.lock:\n                f = self._session_file(sid)\n                if f.exists():\n                    f.unlink()\n        except Exception as e:\n            print(f"[bridge] delete session file {sid} failed: {e}", file=sys.stderr)\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('persistence block not found')
          path.write_text(text, encoding='utf-8')
          PY
      - run: python -m pip install -e .
      - run: python -m py_compile frontends/desktop_bridge.py tests/test_desktop_session_persistence.py
      - run: python -m unittest tests.test_desktop_session_persistence -v
      - run: git diff --check
      - name: Persist production fix when needed
        run: |
          if ! git diff --quiet -- frontends/desktop_bridge.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontends/desktop_bridge.py
            git commit -m "fix(desktop): serialize session persistence"
            git push origin HEAD:${{ github.head_ref }}
          fi
